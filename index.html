<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta http-equiv="X-UA-Compatible" content="ie=edge">
  <meta name="description" content="Progressive Web App text editor powered by Ace.">
  <meta name="theme-color" content="#1a237e">
  <meta name="apple-mobile-web-app-status-bar" content="#1a237e">
  <meta http-equiv="Cache-control" content="public">

  <title>local-ace</title>

  <link rel="manifest" href="manifest.json">
  <link rel="icon" type="image/png" sizes="32x32" href="./images/favicon-32x32.png">
  <link rel="icon" type="image/png" sizes="16x16" href="./images/favicon-16x16.png">
  <link rel="apple-touch-icon" sizes="180x180" href="./images/apple-touch-icon.png">
  <link rel="apple-touch-icon" sizes="192x192" href="./images/android-chrome-192x192.png">

  <link rel="stylesheet" href="./localapp.css">
</head>
<body>

  <!-- Toolbar -->
  <div id="toolbar">
    <!-- Menu -->
    <span class="menu-btn">
      <button class="toolbar-btn" title="Menu">≡</button>
      <div class="menu-content">
        <div class="menu-row">
          <label class="menu-input" for="TabNumber">Tab size</label>
          <input class="menu-input" type="number" id="TabNumber" min="1" max="32">
        </div>
        <div class="menu-row">
          <label class="menu-input" for="WrapToggle">Word wrap</label>
          <input class="menu-input" type="checkbox" id="WrapToggle">
        </div>
        <div class="menu-separator"></div>
        <a id="HelpAbout" class="menu-link" href="">Help / About</a>
      </div>
    </span>

    <!-- File actions -->
    <button id="ReadFile" class="toolbar-btn" title="Open file">↘</button>
    <button id="WriteFile" class="toolbar-btn" title="Save file">↗</button>

    <div class="toolbar-divider"></div>

    <!-- Filename -->
    <input id="FileName" title="Filename (press Enter to confirm)" size="50" autocomplete="off" spellcheck="false">
  </div>

  <!-- Hidden file plumbing -->
  <a id="aDownloadFile" download></a>
  <input type="file" id="filePicker">

  <!-- Editor -->
  <div id="EditText"></div>

  <script src="./ace-builds/src-min-noconflict/ace.js" charset="utf-8"></script>
  <script src="./localfile.js"></script>
  <script src="./localapp.js"></script>

</body>
</html>
